name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: unzip -q firework-fixed-1.21.11.zip -d project

      - name: Loom sürümünü ve kimliğini düzelt
        run: sed -i "s/net\.fabricmc\.fabric-loom' version '1\.13\.6'/net.fabricmc.fabric-loom-remap' version '1.14.10'/" project/build.gradle

      - name: Mapping sürümünü düzelt
        run: sed -i 's/1\.21\.11+build\.4/1.21.11+build.3/' project/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon
        working-directory: project

      - uses: actions/upload-artifact@v4
        with:
          name: firework-fixed-1.21.11
          path: project/build/libs/*.jar
